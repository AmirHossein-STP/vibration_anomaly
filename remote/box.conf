# Project settings for remote/box. Tracked in git: nothing here is secret
# or rental-specific. The current box's address lives in remote/.box.env
# (gitignored), written by `box up <ip>`.

PROJECT=vibration_anomaly_detection   # vault namespace: /mnt/vault/projects/$PROJECT
REMOTE_USER=homa                      # the provider's image always uses this user
VAULT_LABEL=vault                     # ext4 label; the device name (vdb, vdx...) is never used
VAULT_MNT=/mnt/vault
SYNC_INTERVAL=60                      # seconds between SSD -> vault result syncs
UV_VERSION=0.5.11                     # pinned; the binary is cached on the vault

# Staged onto the SSD by every `box up` so the usual analyses run at once.
# name[:part]; see remote/server/stage.sh for what each links to.
STAGE_DEFAULT="cwru:de12 paderborn:v1"

# Top-level paths never pushed as code (data and results move through the vault).
CODE_EXCLUDE="data outputs reports papers kaggle_dataset notebooks"
